<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="720" height="330" fill="#f7f5ef"/>
  <!-- Pico -->
  <rect x="40" y="40" width="190" height="250" rx="12" fill="#1f6f45"/>
  <rect x="115" y="26" width="40" height="24" rx="4" fill="#b8bcc2"/>
  <text x="135" y="64" fill="#e8f3ec" font-size="12.5" font-weight="700" text-anchor="middle">Raspberry Pi Pico / Pico 2</text>
  <g font-size="13" fill="#1d1d1f">
    <!-- pin rows on the right edge of the Pico -->
    <circle cx="230" cy="80" r="6" fill="#c3272e"/><text x="222" y="84" text-anchor="end" fill="#fff" font-weight="600">3V3 OUT (36)</text>
    <circle cx="230" cy="120" r="6" fill="#333"/><text x="222" y="124" text-anchor="end" fill="#fff" font-weight="600">GND (38)</text>
    <circle cx="230" cy="160" r="6" fill="#d97706"/><text x="222" y="164" text-anchor="end" fill="#fff" font-weight="600">GP3 (5)</text>
    <circle cx="230" cy="200" r="6" fill="#2563eb"/><text x="222" y="204" text-anchor="end" fill="#fff" font-weight="600">GP4 (6)</text>
    <circle cx="230" cy="240" r="6" fill="#7c3aed"/><text x="222" y="244" text-anchor="end" fill="#fff" font-weight="600">GP6 (9)</text>
    <circle cx="230" cy="268" r="6" fill="#db2777"/><text x="222" y="272" text-anchor="end" fill="#fff" font-weight="600">GP7 (10)</text>
  </g>
  <!-- wires -->
  <g stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M236 80 H480" stroke="#c3272e"/>
    <path d="M236 120 H480" stroke="#333"/>
    <path d="M236 160 H480" stroke="#d97706"/>
    <path d="M236 200 H480" stroke="#2563eb"/>
    <path d="M236 240 H330 L360 254 H480" stroke="#7c3aed"/>
    <path d="M236 268 H330 L360 254" stroke="#db2777"/>
  </g>
  <circle cx="360" cy="254" r="5" fill="#1d1d1f"/>
  <text x="250" y="300" font-size="11.5" fill="#6d6a63">GP6 + GP7 bridged → one wire to DD</text>
  <!-- label -->
  <rect x="480" y="40" width="200" height="250" rx="14" fill="#fdfdfb" stroke="#cfccc2" stroke-width="2"/>
  <text x="580" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1f">VUSION 2.6 GL420 (CC2510)</text>
  <g font-size="14" fill="#1d1d1f">
    <text x="494" y="85"><tspan font-weight="700">Battery +</tspan> contact</text>
    <text x="494" y="125"><tspan font-weight="700">Battery −</tspan> contact</text>
    <text x="494" y="165"><tspan font-weight="700">RESET_N</tspan></text>
    <text x="494" y="205"><tspan font-weight="700">DC</tspan> = P2_2 (LED boost EN)</text>
    <text x="494" y="259"><tspan font-weight="700">DD</tspan> = P2_1 (white LED)</text>
  </g>
  <text x="360" y="318" font-size="12" text-anchor="middle" fill="#8f1b21">Batteries removed · never connect DCOUPL · keep wires short</text>
</svg>
